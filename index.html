<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pacman Arcade Edition</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
            rel="stylesheet"

        <link rel="stylesheet" href="style.css" type="text/css" />
        <link rel="shortcut icon" href="assets/pacman.ico" type="image/x-icon" />
    </head>

    <body>

                    </svg>
                    <span>@FelipeFMedeiros</span>
                </a>
            </footer>

            <div style="display: none">
                <img id="animations" src="assets/animations.gif" alt="Pacman Mouth Animation" />
                <img id="ghosts" src="assets/ghosts_extended.png" alt="Ghost Spritesheet Extended" />
            </div>
        </div>

        <script src="audio.js"></script>
        <script src="maps.js"></script>
        <script src="ghost.js"></script>
        <script src="pacman.js"></script>
        <script src="game.js"></script>
    </body>
</html>
